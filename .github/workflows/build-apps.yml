name: Build Android

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master

jobs:
  build-android:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install npm dependencies
        run: npm ci

      - name: Build web assets (native mode)
        run: npm run build:native

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease -PTETO_VERSION_CODE=${{ github.run_number }} -PTETO_VERSION_NAME="${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('5.0.{0}', github.run_number) }}"

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk TETO.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TETO-android
          path: TETO.apk

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-android
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: TETO-android

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: TETO.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
