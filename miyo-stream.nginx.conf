# MIYO-STREAM local dev reverse proxy
# Lets friends on the same network access the dev server via your LAN IP
#
# Frontend (Vite dev):  localhost:24729
# Backend  (Express):   localhost:3005  (API + WebSocket)

upstream miyo_vite {
    server 127.0.0.1:24729;
}

upstream miyo_backend {
    server 127.0.0.1:3005;
}

server {
    listen 8080;
    server_name _;

    # Increase timeouts for dev/streaming
    proxy_connect_timeout 300s;
    proxy_send_timeout    300s;
    proxy_read_timeout    300s;

    # Allow large uploads/responses (streaming)
    client_max_body_size 100m;

    # ── API routes → Express backend (port 3005) ──
    location /api/ {
        proxy_pass http://miyo_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Disable buffering for streaming responses
        proxy_buffering off;
    }

    # ── WebSocket (Watch Together) → Express backend ──
    location /ws {
        proxy_pass http://miyo_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # WebSocket timeouts
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ── Vite HMR WebSocket (hot reload for YOU, not your friends) ──
    location /__vite_hmr {
        proxy_pass http://miyo_vite;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # ── Everything else → Vite dev server (port 24729) ──
    location / {
        proxy_pass http://miyo_vite;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
